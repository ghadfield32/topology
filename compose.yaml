x-course: &course
  image: listening-to-shape:12
  build:
    context: .
    args:
      COURSE_PROFILE: ${COURSE_PROFILE:-core}
  user: "${COURSE_UID:-1000}:${COURSE_GID:-1000}"
  environment:
    HOME: /tmp/student
    MPLBACKEND: Agg
    PYTEST_ADDOPTS: -p no:cacheprovider
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  tmpfs:
    - /tmp:rw,nosuid,nodev,mode=1777,size=4g
  volumes:
    - ./my_work:/work
services:
  course:
    <<: *course
    command: ["doctor", "--profile", "${COURSE_PROFILE:-core}"]
  reader:
    <<: *course
    profiles: ["reader"]
    entrypoint: ["python", "-m", "shape_lab.safe_server", "--port", "8000", "--bind", "0.0.0.0", "--root", "/course"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/START_HERE.html', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
  lab:
    <<: *course
    profiles: ["lab"]
    entrypoint: ["python", "-m", "jupyterlab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--ServerApp.root_dir=/course"]
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/course:ro
      - ./my_work:/course/my_work
      - ./my_work:/work
