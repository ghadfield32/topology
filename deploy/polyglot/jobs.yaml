apiVersion: batch/v1
kind: Job
metadata:
  name: shape-go-stage01
  labels:
    app.kubernetes.io/name: listening-to-shape
    app.kubernetes.io/component: go-lab
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: listening-to-shape
        app.kubernetes.io/component: go-lab
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: go
          image: listening-to-shape-go:14
          imagePullPolicy: IfNotPresent
          args: ["--repo", "/course", "--lab", "stage01"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
