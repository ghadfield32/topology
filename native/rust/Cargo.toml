[package]
name = "shape-native"
version = "16.0.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
csv = "=1.3.1"
sha2 = "=0.10.9"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
png = "=0.17.16"

[[bin]]
name = "shape-rust"
path = "src/main.rs"
