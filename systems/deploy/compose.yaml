services:
  worker:
    build:
      context: ../..
      dockerfile: systems/deploy/Dockerfile.worker
    image: shape-systems-worker:17
    read_only: true
    user: '10001:10001'
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ['127.0.0.1:8090:8090']
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=64m']
    mem_limit: 1g
    cpus: 1
